<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send Notification</title>
  <link rel="stylesheet" href="index.css">



</head>

<body>
  <header>Send Notification</header>

  <div class="layout">
    <aside>
      <p>NOTIFICATION CENTER</p>
      <nav aria-label="Main navigation">
        <a href="#">Dashboard</a>
        <a href="#" aria-current="page">Send Notification</a>
        <a href="#">History</a>
        <a href="#">Settings</a>
      </nav>
    </aside>

    <main>
      <h1>Send Notification</h1>
      <p class="subtitle">
        Choose one or more channels and send a notification.
      </p>

      <form class="card">
        <h2>Notification Details</h2>

        <label for="subject">Title / Subject</label>
        <input
          id="subject"
          name="subject"
          type="text"
          placeholder="Job Completed"
        >

        <label for="message">Message</label>
        <textarea
          id="message"
          name="message"
          placeholder="Customer data processing completed successfully."
        ></textarea>

        <fieldset>
          <legend>Select Channels</legend>

          <div class="channels">
            <label class="channel">
              <input type="checkbox" name="channels" value="teams">
              <span>Teams</span>
            </label>

            <label class="channel">
              <input type="checkbox" name="channels" value="email">
              <span>Email</span>
            </label>

            <label class="channel">
              <input type="checkbox" name="channels" value="slack">
              <span>Slack</span>
            </label>
          </div>
        </fieldset>

        <div class="footer">
          <p class="hint">Choose your notification destinations above.</p>
          <button type="button" class="send-button">Send</button>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
