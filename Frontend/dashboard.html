<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta name="description" content = "View information about the notifications"/>
        <title>Notification Dashboard</title>
        <link rel="stylesheet" href="dashboard.css"/>
        <link rel="stylesheet" href="index.css"/> 
    </head>

    <body>
        <header>Notification Dashboard</header>
        <div class="layout">
            <aside>
                <p>NOTIFICATION CENTER</p>
                <nav aria-label="Main navigation">
                    <a href="#">Dashboard</a>
                    <a href="#" aria-current="page">Send Notification</a>
                    <a href="#">History</a>
                    <a href="#">Settings</a>
                </nav>
            </aside>
            <main>
                <h1>Notifications</h1>
                <p class="subtitle">View Email, Slack and Teams notifications here</p>

                <div class="stats">
                    <div class="statistic">
                        <p class="subtitle">Total</p>
                        <h2>20</h2>
                    </div>

                    <div class="statistic">
                        <p class="subtitle">Delivered</p>
                        <h2 style="color : green">14</h2>
                    </div>

                    <div class="statistic">
                        <p class="subtitle">Pending</p>
                        <h2 style="color : blue">4</h2>
                    </div>

                    <div class="statistic">
                        <p class="subtitle">Failed</p>
                        <h2 style="color : red">2</h2>
                    </div>
                </div>


        </div>
        
    </body> 
</html>
