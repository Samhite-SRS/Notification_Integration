<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notification History</title>
  <style>
    main {
  min-width: 0;
}

.history-card {
  max-width: 1000px;
  min-height: 400px;
  padding: 24px;
  background: white;
  border: 1px solid #dce2ec;
  border-radius: 14px;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 18px 16px;
  text-align: left;
  white-space: nowrap;
}

th {
  color: #6b7280;
}

td {
  border-bottom: 1px solid #dce2ec;
}

.delivered {
  color: #008653;
}

.pending {
  color: #2563eb;
}

.failed {
  color: #dc2626;
}
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #202938;
      background: #f5f7fb;
    }

    header {
      background: #192d50;
      color: white;
      padding: 16px 24px;
      font-size: 20px;
      font-weight: bold;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 55px);
    }

    aside {
      width: 190px;
      padding: 24px;
      background: white;
      border-right: 1px solid #e0e5ed;
    }

    aside p {
      font-size: 12px;
      color: #425575;
      margin-bottom: 24px;
    }

    aside a {
      display: block;
      margin-bottom: 20px;
      color: #202938;
      text-decoration: none;
    }

    main {
      flex: 1;
      padding: 28px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 26px;
    }

    .subtitle,
    .hint {
      color: #737d8e;
      font-size: 13px;
    }

    .subtitle {
      margin: 0 0 18px;
    }

    .card {
      max-width: 520px;
      padding: 20px;
      background: white;
      border: 1px solid #dce2ec;
      border-radius: 10px;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 18px;
    }

    label,
    legend {
      font-size: 14px;
      font-weight: bold;
    }

    label {
      display: block;
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 18px;
      border: 1px solid #dce2ec;
      border-radius: 5px;
      font: inherit;
      font-size: 14px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    fieldset {
      padding: 0;
      margin: 0;
      border: 0;
    }

    legend {
      margin-bottom: 10px;
    }

    .channels {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .channel {
      position: relative;
      margin: 0;
      cursor: pointer;
    }

    .channel input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }

    .channel span {
      display: block;
      min-width: 100px;
      padding: 10px 18px;
      text-align: center;
      color: #2962ef;
      background: #f0f5ff;
      border: 1px solid #7198ff;
      border-radius: 6px;
      font-size: 13px;
      font-weight: normal;
    }

    .channel input:checked + span {
      background: #2962ef;
      color: white;
    }

    .channel input:focus-visible + span,
    button:focus-visible {
      outline: 3px solid #192d50;
      outline-offset: 3px;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }

    .hint {
      margin: 0;
    }

    .send-button {
      padding: 10px 24px;
      background: #2962ef;
      color: white;
      border: none;
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
    }

    .send-button:hover {
      background: #1e4fd0;
    }

    @media (max-width: 600px) {
      .layout {
        flex-direction: column;
      }

      aside {
        width: 100%;
        border-right: none;
      }

      main {
        padding: 20px;
      }

      .footer {
        flex-wrap: wrap;
      }
    }
    .search-bar select {
  appearance: none;
  min-width: 150px;
  padding: 8px 20px;
  background: #eef4ff;
  color: #2563eb;
  border: 1px solid #7198ff;
  border-radius: 8px;
  font: inherit;
  text-align: center;
  cursor: pointer;
}
.search-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  margin-bottom: 24px;
  background: white;
  border: 1px solid #dce2ec;
  border-radius: 12px;
}

.search-bar input {
  flex: 1;
  min-width: 0;
  width: auto;
  margin: 0;
  border: none;
}

.search-bar select {
  flex-shrink: 0;
}
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
}

.header-label {
    font-size: 14px;
    font-weight: normal;
    color: #c4cede;
}
  </style>
  </head>

<body>
  <header>
  <span>Notification History</span>
  <span class="header-label">Notification Center</span>
</header>

  <div class="layout">
    <aside>
      <p>NOTIFICATION CENTER</p>
      <nav aria-label="Main navigation">
        <a href="dashboard.html">Dashboard</a>
        <a href="index.html">Send Notification</a>
        <a href="History.html" aria-current="page">History</a>
      </nav>
    </aside>

    <main>
        <h1>Notification History</h1>
        <p class="subtitle">
           Search and filter notification delivery records.
        </p>
      <div class="search-bar">
        <input
        id="search-input"
        type="search"
        placeholder="Search recipient, message or ID"
        aria-label="Search notification history "
        >

        <select id="status-filter" aria-label="Filter by status">
          <option value="all">Filter: All</option>
          <option value="delivered">Delivered</option>
          <option value="pending">Pending</option>
          <option value="failed">Failed</option>
        </select>
      </div>

    <div class="history-card">
        <table>
        <thead>
            <tr>
              <th scope="col">ID</th>
        <th scope="col">Channel</th>
        <th scope="col">Destination</th>
        <th scope="col">Status</th>
        <th scope="col">Retry</th>
        <th scope="col">Time</th>
            </tr>
        </thead>

        <tbody id="history-body">
          <tr><td colspan="6" class="table-empty">Loading...</td></tr>
        </tbody>
  </table>
</div>
</main>
</div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    (function () {
      const tbody = document.getElementById("history-body");
      const searchInput = document.getElementById("search-input");
      const statusFilter = document.getElementById("status-filter");
      let debounceHandle = null;

      function statusCssClass(status) {
        // History.html has its own inline .delivered/.pending/.failed rules
        // (separate from the shared .status-badge classes used elsewhere).
        return NotificationUi.statusClass(status);
      }

      // The UI's "Delivered" filter should match both SENT and DELIVERED
      // (the backend only knows the literal status column), so filtering
      // happens client-side per delivery rather than via the status= param.
      const FILTER_STATUSES = {
        delivered: ["SENT", "DELIVERED"],
        pending: ["PENDING"],
        failed: ["FAILED"],
      };

      function renderRows(notifications) {
        const statusValue = statusFilter.value;
        const allowedStatuses = FILTER_STATUSES[statusValue];

        const rows = [];
        notifications.forEach((notification) => {
          const shortId = notification.id.slice(0, 8);
          (notification.deliveries || []).forEach((delivery) => {
            if (allowedStatuses && !allowedStatuses.includes((delivery.status || "").toUpperCase())) return;
            rows.push(`<tr>
              <td>${NotificationUi.escapeHtml(shortId)}</td>
              <td>${NotificationUi.escapeHtml(delivery.channel)}</td>
              <td>${NotificationUi.escapeHtml(delivery.destination)}</td>
              <td class="${statusCssClass(delivery.status)}">${NotificationUi.statusLabel(delivery.status)}</td>
              <td>${delivery.retry_count}</td>
              <td>${NotificationUi.formatTime(delivery.created_at)}</td>
            </tr>`);
          });
        });

        tbody.innerHTML = rows.length
          ? rows.join("")
          : '<tr><td colspan="6" class="table-empty">No matching notifications.</td></tr>';
      }

      async function load() {
        const params = { q: searchInput.value.trim() || undefined, limit: 100 };

        tbody.innerHTML = '<tr><td colspan="6" class="table-empty">Loading...</td></tr>';
        try {
          const result = await NotificationApi.listNotifications(params);
          renderRows(result.items);
        } catch (error) {
          tbody.innerHTML = `<tr><td colspan="6" class="table-error">${NotificationUi.escapeHtml(error.message)}</td></tr>`;
        }
      }

      searchInput.addEventListener("input", () => {
        clearTimeout(debounceHandle);
        debounceHandle = setTimeout(load, 300);
      });
      statusFilter.addEventListener("change", load);

      load();
    })();
  </script>
</body>
</html>
